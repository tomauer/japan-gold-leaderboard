name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    # Rebuild every hour at :07 (JST = UTC+9, so 07:07 JST = 22:07 UTC prev day, etc.)
    - cron: "7 * * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
          NEXT_PUBLIC_BASE_PATH: /japan-gold-leaderboard

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4
        id: deployment
